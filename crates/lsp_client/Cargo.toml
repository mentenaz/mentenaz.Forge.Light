[package]
name = "lsp_client"
version = "0.1.0"
edition.workspace = true

[dependencies]
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "sync", "time", "process", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
