[workspace]
members = ["crates/light_cpu_app/", "crates/forge_shell/", "crates/editor_core/", "crates/lsp_client/", "crates/forge_extensions/"]
default-members = ["crates/forge_shell/"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"


[workspace.dependencies]
# Match the 1.18.1 version lock that Cargo is resolving
slint = { version = "1.18.1", features = ["backend-winit", "renderer-software"] }
slint-build = { version = "1.18.1", features = ["renderer-software"] }

# Tree-sitter grammars are C; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2
